name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/backend-ec2

jobs:
  ci:
    name: Build check
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

  docker:
    name: Build & push image
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the image and push it to Docker Hub
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    needs: docker
    runs-on: ubuntu-latest
    concurrency: production

    steps:
      - name: SSH into EC2 and run the new image
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            docker pull ${{ env.IMAGE }}:${{ github.sha }}

            docker rm -f backend || true
            docker run -d --name backend \
              --init \
              --restart unless-stopped \
              --env-file ~/backend_ec2/.env \
              -e PORT=4000 \
              -p 4000:4000 \
              ${{ env.IMAGE }}:${{ github.sha }}

            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:4000/api/auth/health > /dev/null; then
                echo "App is healthy"
                docker image prune -af
                exit 0
              fi
              sleep 2
            done

            echo "App did not become healthy. Last logs:"
            docker logs --tail 30 backend
            exit 1
